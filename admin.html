<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yardscape Admin Calendar</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><img src="yardscape-logo.jpg" alt="Yardscape logo"></a><nav><a href="index.html">Website</a><a href="booking.html">Booking</a></nav></div></header><main class="booking-page"><div class="container narrow"><p class="eyebrow">Private admin</p><h1>Yardscape booking calendar</h1><p class="intro">Enter the private admin key you created in Google Apps Script.</p><div class="admin-toolbar"><input id="key" type="password" placeholder="Admin key"><button id="load" class="btn">Load</button></div><p id="status" class="status"></p><div class="calendar-head"><button id="prev" class="btn btn-small">‹</button><strong id="month"></strong><button id="next" class="btn btn-small">›</button></div><div id="grid" class="admin-grid"></div><div id="details" class="admin-details"></div></div></main><script>const ENDPOINT='YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL';let v=new Date(new Date().getFullYear(),new Date().getMonth(),1),data={};const key=document.getElementById('key');key.value=localStorage.getItem('yardscapeAdminKey')||'';const iso=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;function draw(){document.getElementById('month').textContent=v.toLocaleDateString(undefined,{month:'long',year:'numeric'});let g=document.getElementById('grid');g.innerHTML=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<b>${x}</b>`).join('');let f=new Date(v.getFullYear(),v.getMonth(),1).getDay(),n=new Date(v.getFullYear(),v.getMonth()+1,0).getDate();for(let i=0;i<f;i++)g.innerHTML+='<div></div>';for(let d=1;d<=n;d++){let x=iso(v.getFullYear(),v.getMonth(),d),c=(data[x]||[]).length;g.innerHTML+=`<button class="admin-day" onclick="show('${x}')"><b>${d}</b><span>${c?c+' booking'+(c>1?'s':''):''}</span></button>`}}async function load(){if(ENDPOINT.startsWith('YOUR_'))return;let k=key.value;if(!k){document.getElementById('status').textContent='Enter your admin key.';return}try{let r=await fetch(ENDPOINT+'?action=admin&key='+encodeURIComponent(k)+'&start='+iso(v.getFullYear(),v.getMonth(),1)+'&end='+iso(v.getFullYear(),v.getMonth()+1,new Date(v.getFullYear(),v.getMonth()+1,0).getDate()));let j=await r.json();if(!j.ok)throw 0;data=j.bookings||{};localStorage.setItem('yardscapeAdminKey',k);document.getElementById('status').textContent='';draw()}catch(e){document.getElementById('status').className='status error';document.getElementById('status').textContent='Could not load. Check the admin key and Apps Script URL.'}}function show(x){let a=data[x]||[];document.getElementById('details').innerHTML='<h2>'+new Date(x+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</h2>'+(a.length?a.map(b=>`<article class="booking-item"><b>${b.time} — ${b.service}</b><br>${b.name} · ${b.phone}<br><a href="mailto:${b.email}">${b.email}</a><br>${b.location}<br><small>${b.notes||''}</small></article>`).join(''):'<p>No bookings.</p>')}document.getElementById('load').onclick=load;document.getElementById('prev').onclick=()=>{v=new Date(v.getFullYear(),v.getMonth()-1,1);load()};document.getElementById('next').onclick=()=>{v=new Date(v.getFullYear(),v.getMonth()+1,1);load()};draw();</script></body></html>
