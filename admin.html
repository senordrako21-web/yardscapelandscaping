<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Yardscape Admin Calendar</title><link rel="stylesheet" href="style.css"></head>
<body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><img src="assets/yardscape-logo.jpg" alt="Yardscape logo"></a><nav><a href="index.html">Website</a><a href="booking.html">Booking</a></nav></div></header>
<main class="booking-page"><div class="container narrow"><p class="eyebrow">Yardscape admin</p><h1>Booking calendar</h1><p class="intro">Enter your private admin key to view bookings.</p>
<div class="admin-toolbar"><input id="key" type="password" placeholder="Admin key"><button id="load" class="btn">Load calendar</button></div><div id="adminStatus" class="status"></div>
<div class="calendar-head"><button id="prev" class="btn btn-small">‹</button><strong id="adminMonth"></strong><button id="next" class="btn btn-small">›</button></div><div id="adminCalendar"></div><div id="details" class="admin-details"></div>
</div></main>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbxmXzRBeJQGZBUnft7rvabX5Q3jhQpAXhet52yWlGPbyvcyRkGd6qVEleNGHYUDn4_w6A/exec';let view=new Date(new Date().getFullYear(),new Date().getMonth(),1),data={};
function iso(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function draw(){document.getElementById('adminMonth').textContent=view.toLocaleDateString(undefined,{month:'long',year:'numeric'});let c=document.getElementById('adminCalendar');c.innerHTML='<div class="admin-grid">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<b>${x}</b>`).join('');let first=new Date(view.getFullYear(),view.getMonth(),1).getDay(),days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();for(let i=0;i<first;i++)c.innerHTML+='<div></div>';for(let d=1;d<=days;d++){let x=iso(view.getFullYear(),view.getMonth(),d),count=(data[x]||[]).length;c.innerHTML+=`<button class="admin-day" onclick="showDay('${x}')"><b>${d}</b><span>${count?count+' booking'+(count>1?'s':''):''}</span></button>`;}c.innerHTML+='</div>';}
function showDay(x){let list=data[x]||[];document.getElementById('details').innerHTML='<h2>'+new Date(x+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</h2>'+(list.length?list.map(b=>`<article class="booking-item"><b>${b.time} — ${b.service}</b><br>${b.name} · ${b.phone}<br><a href="mailto:${b.email}">${b.email}</a><br>${b.location}<br><small>${b.notes||''}</small></article>`).join(''):'<p>No bookings.</p>');}
async function load(){let key=document.getElementById('key').value;if(!key){document.getElementById('adminStatus').className='status error';document.getElementById('adminStatus').textContent='Enter your admin key.';return;}try{let start=iso(view.getFullYear(),view.getMonth(),1),end=iso(view.getFullYear(),view.getMonth()+1,new Date(view.getFullYear(),view.getMonth()+1,0).getDate());let r=await fetch(ENDPOINT+'?action=admin&key='+encodeURIComponent(key)+'&start='+start+'&end='+end),j=await r.json();if(!j.ok)throw new Error(j.error);data=j.bookings||{};localStorage.setItem('yardscapeAdminKey',key);document.getElementById('adminStatus').textContent='';draw();}catch(e){document.getElementById('adminStatus').className='status error';document.getElementById('adminStatus').textContent='Could not load calendar. Check your admin key and Apps Script deployment.';}}
document.getElementById('load').onclick=load;document.getElementById('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);load();};document.getElementById('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);load();};document.getElementById('key').value=localStorage.getItem('yardscapeAdminKey')||'';draw();
</script></body></html>
