<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yardscape Admin</title><link rel="stylesheet" href="style.css"></head>
<body><header><a href="index.html"><img src="assets/yardscape-logo.png" alt="Yardscape"></a><nav><a href="index.html">Website</a><a href="booking.html">Booking</a></nav></header>
<main><small>PRIVATE ADMIN</small><h1>Booking Calendar</h1><div class="adminbar"><input id="key" type="password" placeholder="Admin key"><button class="btn" id="load">Load bookings</button><span id="count"></span></div>
<div class="calhead"><button id="prev">←</button><h2 id="month"></h2><button id="next">→</button></div><div class="week"><b>Sun</b><b>Mon</b><b>Tue</b><b>Wed</b><b>Thu</b><b>Fri</b><b>Sat</b></div><div id="grid" class="calendar"></div>
<div class="details"><h2>Booking details</h2><div id="details">Select a booked date.</div></div></main>
<footer>Yardscape Landscaping & Beautification Services • <a href="mailto:Yardscapelandscaping@gmail.com">Yardscapelandscaping@gmail.com</a> • <a href="tel:+18763427405">+1 876 342-7405</a></footer>
<script>
const API="https://script.google.com/macros/s/AKfycbxmXzRBeJQGZBUnft7rvabX5Q3jhQpAXhet52yWlGPbyvcyRkGd6qVEleNGHYUDn4_w6A/exec";let data={},cur=new Date();
function jp(p){return new Promise((resolve,reject)=>{const c="ad_"+Date.now()+"_"+Math.random().toString(36).slice(2),x=document.createElement("script");let timer;window[c]=v=>{clearTimeout(timer);delete window[c];x.remove();resolve(v)};x.onerror=()=>{clearTimeout(timer);delete window[c];x.remove();reject(new Error("Could not connect to the booking service."))};x.src=API+"?"+new URLSearchParams({...p,callback:c});document.body.appendChild(x);timer=setTimeout(()=>{delete window[c];x.remove();reject(new Error("Admin request timed out."))},15000)})}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(){const y=cur.getFullYear(),m=cur.getMonth();document.getElementById("month").textContent=cur.toLocaleString("en-US",{month:"long",year:"numeric"});const g=document.getElementById("grid");g.innerHTML="";const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)g.appendChild(document.createElement("div"));for(let day=1;day<=days;day++){const k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0"),b=data[k]||[],c=document.createElement("button");c.className="day"+(b.length?" booked":"");c.innerHTML="<b>"+day+"</b>"+(b.length?"<small>"+b.length+" booking(s)</small>":"");c.onclick=()=>show(k);g.appendChild(c)}}
function show(k){const b=data[k]||[];document.getElementById("details").innerHTML=b.length?b.map(x=>"<article><h3>"+esc(x.service)+"</h3><p><b>"+esc(x.date)+" at "+esc(x.time)+"</b></p><p><b>Customer:</b> "+esc(x.name)+"</p><p><b>Email:</b> "+esc(x.email)+"</p><p><b>Phone:</b> "+esc(x.phone)+"</p><p><b>Location:</b> "+esc(x.location)+"</p><p><b>Price / Quote:</b> "+esc(x.price)+"</p><p><b>Notes:</b> "+esc(x.notes||"None")+"</p></article>").join(""):"No bookings for "+k+"."}
document.getElementById("load").onclick=async()=>{try{const r=await jp({action:"admin",key:document.getElementById("key").value.trim()});if(!r.ok)throw Error(r.error||"Could not load bookings.");data=r.bookings||{};document.getElementById("count").textContent=Object.values(data).reduce((a,b)=>a+b.length,0)+" booking(s)";render()}catch(e){alert(e.message)}};
document.getElementById("prev").onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};document.getElementById("next").onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};render();
</script></body></html>
