<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book a Service | Yardscape</title><link rel="stylesheet" href="style.css"></head>
<body><header><a href="index.html"><img src="assets/yardscape-logo.png" alt="Yardscape"></a><nav><a href="index.html">Home</a><a href="index.html#services">Services</a><a href="index.html#contact">Contact</a></nav></header>
<main><small>YARDSCAPE ONLINE BOOKING</small><h1>Book a service</h1><p>Choose your service, date and time. Quote-required services will be reviewed by our team.</p>
<form id="f"><label>Service<select name="service" id="s" required><option value="">Select a service</option><option value="General Lawncare" data-price="JMD 8,000">General Lawncare — JMD 8,000</option><option value="Plant Bed Maintenance" data-price="Quote Required">Plant Bed Maintenance — Quote Required</option><option value="Flowers Planting" data-price="Quote Required">Flowers Planting — Quote Required</option><option value="Flower Hedging" data-price="JMD 5,000">Flower Hedging — JMD 5,000</option><option value="Sprinkler Installation" data-price="JMD 12,000">Sprinkler Installation — JMD 12,000</option></select></label>
<div class="two"><label>Date<input id="d" name="date" type="date" required></label><label>Time<select id="t" name="time" required><option value="">Select time</option></select></label></div><p id="avail"></p>
<label>Full name<input name="name" required></label><div class="two"><label>Email<input name="email" type="email" required></label><label>Phone / WhatsApp<input name="phone" required></label></div>
<label>Property location<input name="location" required></label><label>Notes<textarea name="notes" rows="4"></textarea></label>
<p><b>Price / Quote:</b> <span id="price">Select a service</span></p><button class="btn" id="submit">Submit Booking Request</button><p id="msg"></p></form></main>
<footer>Yardscape Landscaping & Beautification Services • <a href="mailto:Yardscapelandscaping@gmail.com">Yardscapelandscaping@gmail.com</a> • <a href="tel:+18763427405">+1 876 342-7405</a></footer>
<script>
const API="https://script.google.com/macros/s/AKfycbxmXzRBeJQGZBUnft7rvabX5Q3jhQpAXhet52yWlGPbyvcyRkGd6qVEleNGHYUDn4_w6A/exec";
const f=document.getElementById("f"),s=document.getElementById("s"),d=document.getElementById("d"),t=document.getElementById("t"),msg=document.getElementById("msg"),av=document.getElementById("avail");
for(let h=8;h<=17;h++){for(const m of [0,30]){if(h===17&&m===30)continue;const o=document.createElement("option");o.value=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");o.textContent=o.value;t.appendChild(o)}}
function jp(p){return new Promise((resolve,reject)=>{const c="ys_"+Date.now()+"_"+Math.random().toString(36).slice(2),x=document.createElement("script");let timer;window[c]=v=>{clearTimeout(timer);delete window[c];x.remove();resolve(v)};x.onerror=()=>{clearTimeout(timer);delete window[c];x.remove();reject(new Error("Could not connect to the booking service."))};x.src=API+"?"+new URLSearchParams({...p,callback:c});document.body.appendChild(x);timer=setTimeout(()=>{delete window[c];x.remove();reject(new Error("Booking service timed out."))},15000)})}
async function check(){if(!d.value||!t.value)return;av.textContent="Checking availability…";try{const r=await jp({action:"availability",date:d.value,time:t.value});if(!r.ok)throw Error(r.error||"Availability check failed");av.textContent=r.booked?"That date and time is already booked. Please choose another time.":"This time is available.";av.className=r.booked?"bad":"good"}catch(e){av.textContent=e.message;av.className="bad"}}
s.onchange=()=>document.getElementById("price").textContent=s.selectedOptions[0].dataset.price||"Select a service";d.onchange=t.onchange=check;
f.onsubmit=async e=>{e.preventDefault();msg.textContent="Sending…";document.getElementById("submit").disabled=true;const q=Object.fromEntries(new FormData(f));q.action="book";q.price=s.selectedOptions[0].dataset.price||"Quote Required";try{const r=await jp(q);if(!r.ok)throw Error(r.error||"Booking could not be completed.");msg.textContent="Booking request received. Check your email for confirmation.";msg.className="good";f.reset();document.getElementById("price").textContent="Select a service";av.textContent=""}catch(e){msg.textContent=e.message;msg.className="bad"}document.getElementById("submit").disabled=false};
</script></body></html>
